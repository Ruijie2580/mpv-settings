# ============================================================
# uosc.conf — Neo Glass style
# Path: %APPDATA%\mpv\script-opts\uosc.conf
# Design: dark translucent floating glass bar, rounded, cool blue accent
# ============================================================

# ------------------------------------------------------------
# Top bar — intentionally quiet, not IINA-like
# ------------------------------------------------------------
top_bar=no-border
top_bar_size=38
top_bar_title=yes
top_bar_controls=right
top_bar_persistency=

# ------------------------------------------------------------
# Bottom controls — floating glass capsule layout
# ------------------------------------------------------------
# Left: playback controls + speed adjustment
# Right: subtitles / tracks / fullscreen
# Playlist/Files and Menu buttons are removed from the control bar.
# Right click opens the uosc menu via input.conf.
# Speed button calls neoglass-speed.lua, which shows speed at top-left.
controls=prev,play-pause,next,gap,command:speed:script-message neoglass-speed-cycle?Speed,space,command:volume_up:script-message neoglass-volume-menu?Volume,<video,audio>subtitles,audio,<has_many_video>video
controls_size=40
controls_margin=20
controls_spacing=7
controls_persistency=

# ------------------------------------------------------------
# Timeline — slim luminous glass-like progress line
# ------------------------------------------------------------
timeline_style=line
timeline_size=42
timeline_line_width=4
timeline_border=1
timeline_cache=yes
timeline_step=5
timeline_persistency=
timeline_heatmap=overlay

# Subtle progress line when controls are hidden.
progress=windowed
progress_size=2
progress_line_width=20

# ------------------------------------------------------------
# Volume
# ------------------------------------------------------------
# Disabled: replaced by a compact volume button in the controls bar.
volume=no
volume_size=46
volume_border=1
volume_step=1
volume_persistency=

# ------------------------------------------------------------
# Menu — translucent glass panel
# ------------------------------------------------------------
menu_item_height=37
menu_min_width=315
menu_padding=8
menu_type_to_search=yes

# ------------------------------------------------------------
# Scale / typography / shape
# ------------------------------------------------------------
scale=1.04
scale_fullscreen=1.20
font_scale=1.03
font_bold=no
text_border=1.1
border_radius=20
window_border_size=1

# ------------------------------------------------------------
# Behavior
# ------------------------------------------------------------
animation_duration=135
flash_duration=850
proximity_in=42
proximity_out=135
autohide=no
pause_indicator=flash
adjust_osd_margins=yes
speed_step=0.1
speed_step_is_factor=no

# ------------------------------------------------------------
# Colors — cool dark glass + soft blue accent
# ------------------------------------------------------------
color=foreground=eaf2ff,foreground_text=08101f,background=0d1320,background_text=eaf2ff,curtain=000000,success=86efac,error=ff6b7a,match=8ab4ff,heatmap=8ab4ff

# ------------------------------------------------------------
# Opacity — glass simulation
# Note: uosc cannot do real blur; this simulates glass with translucency.
# ------------------------------------------------------------
opacity=timeline=0.90,position=0.96,chapters=0.68,slider=0.90,slider_gauge=1,controls=0.24,speed=0.64,menu=0.82,submenu=0.48,border=0.72,title=0.68,tooltip=0.86,thumbnail=1,curtain=0.42,idle_indicator=0.66,audio_indicator=0.46,buffering_indicator=0.28,playlist_position=0.76,heatmap=0.32

# ------------------------------------------------------------
# Files / Playlist behavior
# ------------------------------------------------------------
default_directory=~/
show_hidden_files=no
use_trash=no
load_types=video,audio,image
