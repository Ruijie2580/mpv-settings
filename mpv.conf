# ============================================================
# mpv.conf
# Path: %APPDATA%\mpv\mpv.conf
# Hardware: Intel Core Ultra 9 185H + RTX 5070 Ti + 32GB RAM
# Display: 4K high refresh / 3200x2000 high refresh
# Notes:
#   - uosc is used as UI, default OSC is disabled.
#   - Default shader is FSRCNNX for natural-looking anime upscaling.
#   - Old modernx and playlistmanager have been removed.
# ============================================================

# ------------------------------------------------------------
# 01. General / Startup
# ------------------------------------------------------------
quiet=yes
save-position-on-quit=yes
title=${filename}
cursor-autohide=1000

# Borderless player window: hide native Windows title bar/borders.
# uosc provides the in-player top bar instead.
border=no
window-dragging=yes

# ------------------------------------------------------------
# 02. Video Output / Rendering
# ------------------------------------------------------------
# Vulkan is required for GLSL shader support and works well on RTX 5070 Ti.
gpu-api=vulkan
profile=gpu-hq

# Hardware decode via NVIDIA NVDEC.
hwdec=nvdec-copy
hwdec-codecs=all

# High-quality scaling.
scale=ewa_lanczossharp
dscale=lanczos
cscale=lanczos

# High-refresh display sync.
video-sync=display-resample

# Dithering.
dither-depth=auto
dither=fruit

# HDR / tone mapping.
hdr-compute-peak=yes
tone-mapping=hable
tone-mapping-max-boost=1.0
gamut-mapping-mode=auto

# Software fallback tuning.
vd-lavc-threads=16
framedrop=vo

# ------------------------------------------------------------
# 03. GLSL Shaders
# ------------------------------------------------------------
# Default natural-looking upscaler.
# Source: igv/FSRCNN-TensorFlow release 1.1
# Alternative shortcuts are configured in input.conf:
#   Ctrl+7 = FSRCNNX 8-channel natural
#   Ctrl+8 = FSRCNNX 16-channel quality
#   Ctrl+1~4 = Anime4K official modes
#   Ctrl+0 = clear all shaders
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

# ------------------------------------------------------------
# 04. Cache / Network
# ------------------------------------------------------------
cache=yes
cache-secs=60
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=128MiB
network-timeout=10

ytdl=yes
ytdl-format=bestvideo[height<=2160]+bestaudio/best[height<=2160]

# ------------------------------------------------------------
# 05. Audio
# ------------------------------------------------------------
volume=100
volume-max=150

# WASAPI shared mode: low latency while allowing other apps to play audio.
audio-device=wasapi
audio-exclusive=no

audio-resample-cutoff=0.95

# ------------------------------------------------------------
# 06. Subtitles
# ------------------------------------------------------------
sub-auto=fuzzy
# Rounded CJK subtitle font. SC is primary; TC/J regional variants are also in ~~\fonts for fallback/selection.
sub-font='Resource Han Rounded SC'
sub-font-size=48
sub-color='#FFFFFFFF'
sub-border-size=2.5
sub-border-color='#FF000000'
sub-shadow-offset=1
sub-shadow-color='#80000000'
sub-margin-y=35
sub-codepage=utf-8

# Custom fonts used by uosc and CJK subtitles.
osd-fonts-dir=~~/fonts

# ------------------------------------------------------------
# 07. OSD / UI
# ------------------------------------------------------------
# uosc handles the UI, so mpv's built-in OSC is disabled.
osc=no

osd-level=1
osd-duration=2000
osd-font='Noto Sans CJK SC'
osd-font-size=28

# ------------------------------------------------------------
# 08. Screenshots
# ------------------------------------------------------------
screenshot-format=png
screenshot-png-compression=5
screenshot-directory=~~desktop/
